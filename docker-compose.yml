version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ABB_REDIS_URL=redis://redis:6379
      - ABB_DEBUG=true
      - ABB_CORS_ORIGINS=["http://localhost:3000"]
      - ABB_AGENT_STEP_DELAY_MS=800
      - ABB_REAL_EXECUTION_ENABLED=false
      - ABB_ALLOWED_REPO_HOSTS=["github.com"]
      - ABB_OPENAI_API_KEY=
      - ABB_OPENAI_MODEL_PLANNER=gpt-5-mini
      - ABB_OPENAI_MODEL_SUMMARY=gpt-5-nano
      - ABB_OPENAI_TIMEOUT_SECONDS=60
      - ABB_BLAXEL_API_KEY=
      - ABB_BL_WORKSPACE=
      - ABB_BLAXEL_REGION=us-pdx-1
      - ABB_BLAXEL_IMAGE=blaxel/base-image:latest
      - ABB_BLAXEL_SANDBOX_TTL=3600
      - ABB_TASK_MAX_STEPS=5
      - ABB_COMMAND_TIMEOUT_MS=60000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  redis_data:
